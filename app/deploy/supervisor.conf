; GOAIEZ runtime — §265
; ⛔ THE SCHEDULER IS numprocs=1. TWO SCHEDULERS DOUBLE-SEND EVERY REMINDER IN THE PRODUCT.

[program:goaiez-worker]
command=php /var/www/goaiez/artisan queue:work --queue=high,default,low --sleep=1 --max-time=3600 --rest=0
; ⛔ NO --tries. Retry is a per-job decision here (AutopilotJob declares its own);
;    a global flag silently overrides every one of them.
directory=/var/www/goaiez
autostart=true
autorestart=true
numprocs=4
process_name=%(program_name)s_%(process_num)02d
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/goaiez/worker.log
stopwaitsecs=3660
; stopwaitsecs > max-time so a restart DRAINS instead of killing an in-flight job (X-129).

[program:goaiez-scheduler]
command=php /var/www/goaiez/artisan schedule:work
directory=/var/www/goaiez
autostart=true
autorestart=true
numprocs=1
; ⛔⛔ ONE. NEVER TWO. Asserted by app:deploy-check.
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/goaiez/scheduler.log
stopwaitsecs=70

[group:goaiez]
programs=goaiez-worker,goaiez-scheduler
