name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: goaiez_antig_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, bcmath, redis
          coverage: none

      - name: Install Dependencies
        working-directory: app
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env
        working-directory: app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint Code Style Check
        working-directory: app
        run: ./vendor/bin/pint --test

      - name: PHPStan Static Analysis
        working-directory: app
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Doctor Self-Test
        working-directory: app
        run: php artisan doctor:selftest

      - name: Doctor Audit (Full Diagnostic & Gated Stages)
        working-directory: app
        run: |
          echo "=== 8-Stage Platform Diagnostic Report ==="
          php artisan doctor || true
          echo "=== Enforcing Integrity & Journey Stage Gates ==="
          php artisan doctor --stage=integrity
          php artisan doctor --stage=journey

      - name: Run Test Suite
        working-directory: app
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: goaiez_antig_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
          QUEUE_CONNECTION: database
        run: ./vendor/bin/pest
